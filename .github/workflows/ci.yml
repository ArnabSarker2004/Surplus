name: Surplus checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run intelligence:setup
      - run: npm run test:intelligence
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:intelligence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/
            test-results/
          retention-days: 7
